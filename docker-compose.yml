services:
  mysql:
    image: mysql:8.4
    container_name: skilltrack-mysql
    environment:
      MYSQL_DATABASE: skilltrack
      MYSQL_USER: skilltrack
      MYSQL_PASSWORD: skilltrack
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306" # 3307 no host para não conflitar com outro MySQL local
    volumes:
      - skilltrack-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uskilltrack", "-pskilltrack"]
      interval: 5s
      retries: 20

volumes:
  skilltrack-data:
