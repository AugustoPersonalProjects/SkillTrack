name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # os testes sobem um MySQL real com Testcontainers, usando o Docker do runner
      - name: Testes
        run: ./mvnw -B verify

      - name: Guarda os relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-dos-testes
          path: target/surefire-reports

      # a mesma imagem que o Render constrói no deploy
      - name: Build da imagem Docker
        run: docker build -t skilltrack .
