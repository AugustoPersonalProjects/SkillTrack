spring.application.name=skilltrack
server.port=${PORT:8080}

# Banco de dados (MySQL) - sobrescreva com variaveis de ambiente fora do ambiente local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/skilltrack?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:skilltrack}
spring.datasource.password=${DB_PASSWORD:skilltrack}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Obrigatorio: sem JWT_SECRET a aplicacao nao inicia. Localmente, o perfil dev define um valor
api.security.token.secret=${JWT_SECRET}

# ADMIN inicial (opcional): criado na inicializacao, ou promovido se o e-mail ja existir
api.admin.email=${ADMIN_EMAIL:}
api.admin.password=${ADMIN_PASSWORD:}
api.admin.name=${ADMIN_NAME:Administrador}

# Origens do front-end liberadas no CORS (separadas por virgula)
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
