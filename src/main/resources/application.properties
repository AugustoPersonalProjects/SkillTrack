spring.application.name=skilltrack

# Banco de dados (MySQL) - sobrescreva com variaveis de ambiente fora do ambiente local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/skilltrack?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:skilltrack}
spring.datasource.password=${DB_PASSWORD:skilltrack}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Em producao, defina JWT_SECRET com um valor longo e aleatorio
api.security.token.secret=${JWT_SECRET:skilltrack-dev-secret-troque-em-producao}

# Origens do front-end liberadas no CORS (separadas por virgula)
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
